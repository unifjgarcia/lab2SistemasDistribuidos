version: "3.9"

services:
  broker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc7261:pyzmq-broker
    volumes:
      - ./broker.py:/app/main.py
    ports:
      - "5555:5555"  # clientes falam aqui
      - "5556:5556"  # servidor fala aqui

  servidor:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc7261:pyzmq
    volumes:
      - ./servidor.py:/app/main.py
    depends_on:
      - broker

  cliente:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc7261:pyzmq
    volumes:
      - ./cliente.py:/app/main.py
    depends_on:
      - broker
      - servidor
    stdin_open: true   # <- ESSENCIAIS PRO input()
    tty: true          # <-